[project]
name = "atelier-wyat"
version = "1.0.0"
description = "Boîte à outils de l'atelier « Modèles de décision avec wyat » (100 % local, en français)"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Teïlo Millet", email = "teilomillet@gmail.com" }]
# wyat est installé par scripts/installer.sh avec le bon extra (mlx sur Mac Apple Silicon, inference ailleurs)
dependencies = [
    "wyat==0.1.2",
    "pandas>=2.2,<3",
    "matplotlib>=3.9,<4",
    "tqdm>=4.66",
    "jupyterlab>=4.3,<5",
    "ipykernel>=6.29,<7",
    "pytest>=8",
    "markdown>=3.7",
]

[project.scripts]
atelier = "atelier.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["atelier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
